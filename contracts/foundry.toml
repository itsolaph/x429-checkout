[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Unit, fuzz and invariant tests only (no network): FOUNDRY_PROFILE=offline forge test
[profile.offline]
no_match_path = "test/fork/*"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"

[lint]
# reentrancy-*: every external call goes to USDC (trusted, no hooks) and the entry points are nonReentrant
exclude_lints = ["mixed-case-variable", "reentrancy-events", "reentrancy-no-eth", "block-timestamp", "environment-read-across-mutation", "uninitialized-local"]
